# Legal-only evaluation. No Datehouse/catalog mount; cloud input boundary is
# enforced by --legal-only before routing, retrieval, synthesis and verification.
services:
  ragas-eval:
    environment:
      CHATBOT_GRAPH_ENABLED: "true"
      CHATBOT_GRAPH_SCHEMA: graph_rag_word_repair_v16
      CHATBOT_LISTING_SCHEMA: housing_graph_word_repair_v16
      CHATBOT_LEGAL_SCHEMA: legal_word_repair_v16_20261006
      CHATBOT_LLM_PROVIDER: qwen
      CHATBOT_AGENTS_ENABLED: "true"
      CHATBOT_ANSWER_SYNTHESIS_ENABLED: "true"
    volumes:
      - ./docs:/workspace/docs:ro
      - ./eval/datasets/chatbot_question_bank.txt:/housing_bank.md:ro
