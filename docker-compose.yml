name: nckh

services:
  db:
    build: ./infra/db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nckh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nckh}
      POSTGRES_DB: ${POSTGRES_DB:-nckh}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nckh} -d ${POSTGRES_DB:-nckh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nckh}:${POSTGRES_PASSWORD:-nckh}@db:5432/${POSTGRES_DB:-nckh}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@localhost}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CRAWLER_ENABLED: ${CRAWLER_ENABLED:-false}
      ORS_API_KEY: ${ORS_API_KEY:-}
      CHATBOT_EMBEDDING_MODEL: ${CHATBOT_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      HF_HOME: /models
      TRANSFORMERS_CACHE: /models/hub
      CHATBOT_CONFIDENCE_THRESHOLD: ${CHATBOT_CONFIDENCE_THRESHOLD:-0.65}
      CHATBOT_MAX_RESULTS: ${CHATBOT_MAX_RESULTS:-5}
      CHATBOT_LEGAL_SCHEMA: ${CHATBOT_LEGAL_SCHEMA:-public}
      CHATBOT_LISTING_SCHEMA: ${CHATBOT_LISTING_SCHEMA:-public}
      CHATBOT_GRAPH_ENABLED: ${CHATBOT_GRAPH_ENABLED:-false}
      CHATBOT_GRAPH_SCHEMA: ${CHATBOT_GRAPH_SCHEMA:-graph_rag_v1}
      CHATBOT_AGENTS_ENABLED: ${CHATBOT_AGENTS_ENABLED:-false}
      CHATBOT_QUESTION_ANALYSIS_MODEL: ${CHATBOT_QUESTION_ANALYSIS_MODEL:-gemini-3.1-flash-lite}
      CHATBOT_QUESTION_ANALYSIS_TIMEOUT_SECONDS: ${CHATBOT_QUESTION_ANALYSIS_TIMEOUT_SECONDS:-30}
      CHATBOT_ANSWER_SYNTHESIS_ENABLED: ${CHATBOT_ANSWER_SYNTHESIS_ENABLED:-true}
      CHATBOT_ANSWER_SYNTHESIS_MODEL: ${CHATBOT_ANSWER_SYNTHESIS_MODEL:-}
      CHATBOT_ANSWER_SYNTHESIS_TIMEOUT_SECONDS: ${CHATBOT_ANSWER_SYNTHESIS_TIMEOUT_SECONDS:-60}
      CHATBOT_LLM_PROVIDER: ${CHATBOT_LLM_PROVIDER:-auto}
      CHATBOT_LLM_TIMEOUT_SECONDS: ${CHATBOT_LLM_TIMEOUT_SECONDS:-4}
      CHATBOT_LEGAL_TIMEOUT_SECONDS: ${CHATBOT_LEGAL_TIMEOUT_SECONDS:-120}
      CHATBOT_MAX_OUTPUT_TOKENS: ${CHATBOT_MAX_OUTPUT_TOKENS:-384}
      CHATBOT_WARMUP_ENABLED: ${CHATBOT_WARMUP_ENABLED:-true}
      CHATBOT_WARMUP_TIMEOUT_SECONDS: ${CHATBOT_WARMUP_TIMEOUT_SECONDS:-30}
      LISTING_STATS_CACHE_SECONDS: ${LISTING_STATS_CACHE_SECONDS:-30}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_1: ${GEMINI_API_KEY_1:-}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.1-flash-lite}
      GEMINI_MIN_REQUEST_INTERVAL_SECONDS: ${GEMINI_MIN_REQUEST_INTERVAL_SECONDS:-5}
      GEMINI_BASE_URL: ${GEMINI_DOCKER_BASE_URL:-${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}}
      RISK_AUTO_ASSESS: ${RISK_AUTO_ASSESS:-true}
      RISK_AUTO_ASSESS_LIMIT: ${RISK_AUTO_ASSESS_LIMIT:-1000}
    volumes:
      - legal-model-cache:/models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    develop:
      watch:
        - action: sync+restart
          path: ./apps/api/app
          target: /app/app

  legal-indexer:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.legal-indexer
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nckh}:${POSTGRES_PASSWORD:-nckh}@db:5432/${POSTGRES_DB:-nckh}
      CHATBOT_EMBEDDING_MODEL: ${CHATBOT_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
    volumes:
      - ./Data:/data:ro
      - ./apps/api/app:/workspace/apps/api/app:ro
      - ./scripts:/workspace/scripts:ro
      - ./infra/db/migrations:/workspace/infra/db/migrations:ro
      - ./apps/api/app:/workspace/apps/api/app:ro
      - ./scripts:/workspace/scripts:ro
      - ./infra/db/migrations:/workspace/infra/db/migrations:ro
      - legal-model-cache:/models
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  legal-model-cache:
